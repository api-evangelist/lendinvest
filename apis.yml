name: LendInvest
description: 'LendInvest is a London-based fintech property finance platform and mortgage lender, founded
  in 2013 after spinning out of Montello Bridging Finance, and listed on the London Stock Exchange AIM
  market under the ticker LINV since July 2021. It originates and services short-term bridging finance,
  property development finance, buy-to-let and residential mortgages for UK intermediaries, brokers,
  property developers, landlords and investors, and runs a parallel capital business that lets individual,
  corporate and institutional investors put money into secured UK property loans. The company distributes
  almost entirely through mortgage intermediaries via its Mortgages Portal, and was the first UK fintech
  to securitise its own buy-to-let loan book. LendInvest publishes no public developer API, developer
  portal or SDKs; its broker and borrower integrations run through hosted portals rather than a documented
  public API surface.'
